<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle de pedido')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu('pedidos')}"></nav>

<main class="container page">
    <h2 th:text="${invoice.type + ' N° ' + invoice.id}"></h2>

    <div class="card card-body mb-3">
        <div><strong>Fecha:</strong> <span th:text="${#temporals.format(invoice.date, 'dd/MM/yyyy')}"></span></div>
        <div><strong>Cliente:</strong> <span th:text="${invoice.customer.name}"></span></div>
        <div><strong>Documento:</strong>
            <span th:text="${invoice.customer.documentType + ' ' + invoice.customer.document}"></span></div>
    </div>

    <table class="table bg-white">
        <thead class="table-dark">
        <tr>
            <th>Producto</th>
            <th class="text-end">Cantidad</th>
            <th class="text-end">Precio (S/)</th>
            <th class="text-end">Subtotal (S/)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${invoice.details}">
            <td th:text="${d.product.name}"></td>
            <td class="text-end" th:text="${d.quantity}"></td>
            <td class="text-end" th:text="${#numbers.formatDecimal(d.price, 1, 'COMMA', 2, 'POINT')}"></td>
            <td class="text-end" th:text="${#numbers.formatDecimal(d.subtotal, 1, 'COMMA', 2, 'POINT')}"></td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="3" class="text-end">Total</th>
            <th class="text-end" th:text="${'S/ ' + #numbers.formatDecimal(invoice.total, 1, 'COMMA', 2, 'POINT')}"></th>
        </tr>
        </tfoot>
    </table>

    <a class="btn btn-secondary" th:href="@{/invoices}">Volver a pedidos</a>
</main>
</body>
</html>
