<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Fragmentos reutilizables: head, menú de navegación y mensajes flash -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Portal de gestión comercial'">Portal de gestión comercial</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav th:fragment="menu(activo)" class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container page">
        <a class="navbar-brand" th:href="@{/}">Gestión Comercial</a>
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activo == 'inicio'} ? 'active'" th:href="@{/}">Inicio</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activo == 'clientes'} ? 'active'" th:href="@{/customers}">Clientes</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activo == 'catalogo'} ? 'active'" th:href="@{/products}">Catálogo</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activo == 'pedidos'} ? 'active'" th:href="@{/invoices}">Pedidos</a>
            </li>
        </ul>
    </div>
</nav>

<div th:fragment="mensajes">
    <div th:if="${msg != null}" class="alert alert-success" th:text="${msg}"></div>
    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
</div>

</body>
</html>
