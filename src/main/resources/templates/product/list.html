<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Catálogo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu('catalogo')}"></nav>

<main class="container page">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Catálogo de productos</h2>
        <a class="btn btn-primary" th:href="@{/products/new}">Nuevo producto</a>
    </div>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <table class="table table-striped bg-white">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Nombre</th>
            <th class="text-end">Precio (S/)</th>
            <th class="text-end">Stock</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${products.isEmpty()}">
            <td colspan="5" class="text-center text-muted">No hay productos registrados</td>
        </tr>
        <tr th:each="p : ${products}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.name}"></td>
            <td class="text-end" th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')}"></td>
            <td class="text-end">
                <span th:text="${p.stock}"></span>
                <span th:if="${p.stock == 0}" class="badge bg-danger ms-1">Agotado</span>
            </td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-primary" th:href="@{/products/edit(id=${p.id})}">Editar</a>
                <form th:action="@{/products/delete}" method="post" class="d-inline">
                    <input type="hidden" name="id" th:value="${p.id}">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
